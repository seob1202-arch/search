<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한인 비즈니스 검색</title>
    <style>
        /* (모든 CSS 스타일 코드) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }
        .page { display: none; min-height: 100vh; }
        .page.active { display: block; }
        #mainPage {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            padding: 20px;
        }
        .main-container { max-width: 600px; margin: 0 auto; }
        .main-buttons { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        .main-btn { padding: 18px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .main-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3); }
        .main-btn.secondary { background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); }
        .main-btn.secondary:hover { background: rgba(255,255,255,0.15); }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 20px 10px; border-radius: 10px; text-align: center; }
        .stat-number { font-size: 28px; font-weight: bold; color: #667eea; }
        .stat-label { font-size: 12px; color: #888; margin-top: 5px; }
        .featured-title { color: white; font-size: 18px; margin-bottom: 15px; }
        .featured-container { position: relative; margin: 0 -20px; padding: 0 20px; }
        .featured-list { display: flex; gap: 15px; overflow-x: auto; scroll-behavior: smooth; padding-bottom: 10px; -webkit-overflow-scrolling: touch; }
        .featured-list::-webkit-scrollbar { height: 6px; }
        .featured-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .featured-list::-webkit-scrollbar-thumb { background: rgba(102, 126, 234, 0.5); border-radius: 10px; }
        .featured-list::-webkit-scrollbar-thumb:hover { background: rgba(102, 126, 234, 0.7); }
        .featured-card { background: rgba(255,255,255,0.08); padding: 15px; border-radius: 10px; cursor: pointer; min-width: 200px; flex: 0 0 auto; transition: all 0.3s; border: 1px solid rgba(102, 126, 234, 0.2); }
        .featured-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.12); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3); }
        .scroll-indicator { display: flex; justify-content: center; gap: 5px; margin-top: 15px; }
        .scroll-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: all 0.3s; }
        .scroll-dot.active { width: 20px; border-radius: 3px; background: #667eea; }
        .featured-name { color: white; font-size: 15px; font-weight: 600; }
        .featured-info { color: #888; font-size: 13px; margin: 5px 0; }
        .featured-rating { color: #fbbf24; font-size: 13px; }
        #searchPage { background: white; }
        .search-header { background: linear-gradient(135deg, #667eea, #764ba2); padding: 20px; color: white; display: flex; align-items: center; gap: 15px; }
        .back-btn { background: rgba(255, 255, 255, 0.2); border: none; color: white; font-size: 24px; cursor: pointer; padding: 8px 12px; border-radius: 8px; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        .back-btn:hover { background: rgba(255, 255, 255, 0.3); }
        .header-title { font-size: 18px; font-weight: 600; }
        .search-content { padding: 20px; max-width: 600px; margin: 0 auto; }
        .section { margin-bottom: 25px; }
        .section-title { display: flex; align-items: center; gap: 8px; margin-bottom: 15px; font-size: 15px; font-weight: 600; color: #333; }
        .location-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .location-chip { padding: 10px 5px; text-align: center; background: white; border: 2px solid #e0e0e0; border-radius: 10px; cursor: pointer; font-size: 13px; color: #333; }
        .location-chip.selected { background: #667eea; color: white; border-color: #667eea; }
        .service-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .service-item { padding: 12px; background: #f5f5f5; border: 2px solid #e0e0e0; border-radius: 10px; cursor: pointer; font-size: 13px; color: #333; }
        .service-item.selected { background: #667eea; color: white; border-color: #667eea; }
        .search-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 10px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        #resultsPage { background: #f5f5f5; }
        .results-header { background: white; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .results-info { margin-top: 10px; font-size: 14px; color: #666; }
        .filter-tabs { display: flex; gap: 10px; padding: 15px; overflow-x: auto; background: white; }
        .filter-btn { padding: 8px 15px; background: white; border: 1px solid #ddd; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .filter-btn.active { background: #667eea; color: white; border-color: #667eea; }
        .business-list { padding: 15px; }
        .business-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); cursor: pointer; }
        .biz-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .biz-name { font-size: 15px; font-weight: 600; color: #333; }
        .biz-rating { color: #fbbf24; font-size: 14px; }
        .biz-info { font-size: 13px; color: #666; margin-bottom: 8px; }
        .biz-tags { display: flex; flex-wrap: wrap; gap: 5px; }
        .tag { padding: 3px 8px; background: #f0f4ff; color: #667eea; border-radius: 5px; font-size: 11px; }
        #detailPage { background: white; }
        .detail-header { background: linear-gradient(135deg, #667eea, #764ba2); padding: 20px; color: white; }
        .detail-name { font-size: 22px; font-weight: bold; margin: 15px 0 10px; }
        .detail-rating { font-size: 14px; }
        .detail-content { padding: 20px; }
        .info-section { margin-bottom: 25px; }
        .info-title { font-size: 16px; font-weight: 600; margin-bottom: 15px; color: #333; }
        .info-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #eee; }
        .info-icon { width: 35px; height: 35px; background: #f0f4ff; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .info-text { flex: 1; font-size: 14px; color: #555; }
        .info-text a { 
            color: #667eea; 
            text-decoration: none; 
            font-weight: 500;
            transition: all 0.2s;
        }
        .info-text a:hover { 
            color: #764ba2; 
            text-decoration: underline; 
        }
        .action-buttons { display: flex; gap: 12px; margin: 20px 0; }
        .action-btn { flex: 1; padding: 14px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .action-btn.primary { background: #667eea; color: white; }
        .action-btn.primary:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3); }
        .action-btn.secondary { background: #f0f4ff; color: #667eea; }
        .action-btn.secondary:hover { background: #e0e8ff; transform: translateY(-2px); box-shadow: 0 4px 8px rgba(102, 126, 234, 0.2); }
        .review { background: #f8f9fa; padding: 12px; border-radius: 8px; margin-bottom: 10px; }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .reviewer { font-weight: 600; font-size: 14px; }
        .review-date { color: #999; font-size: 12px; }
        .review-text { font-size: 13px; color: #555; line-height: 1.4; }
        .loading { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,0.9); display: none; align-items: center; justify-content: center; z-index: 9999; }
        .loading.show { display: flex; }
        .spinner { width: 40px; height: 40px; border: 3px solid #e0e0e0; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (min-width: 768px) {
            .main-container { max-width: 800px; }
            .main-buttons { flex-direction: row; justify-content: center; gap: 20px; }
            .main-btn { flex: 0 1 300px; padding: 20px; }
            .featured-card { min-width: 240px; }
            .business-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .business-card { margin-bottom: 0; }
            .search-content { max-width: 700px; }
            .location-grid { grid-template-columns: repeat(4, 1fr); }
            .service-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (min-width: 1024px) {
            .main-container { max-width: 900px; }
            .featured-card { min-width: 260px; }
            .business-list { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>
    
    <div class="page" id="mainPage">
        <div class="main-container">
            <div class="main-buttons">
                <button class="main-btn" onclick="goToSearch()">
                    📍 한인 비즈니스 찾기
                </button>
                <button class="main-btn secondary">
                    💼 무료로 등록하기
                </button>
            </div>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-number">50+</div>
                    <div class="stat-label">국가 및 도시</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">11</div>
                    <div class="stat-label">카테고리</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">100%</div>
                    <div class="stat-label">무료 서비스</div>
                </div>
            </div>
            
            <h2 class="featured-title">🔥 인기 비즈니스</h2>
            <div class="featured-container">
                <div class="featured-list" id="featuredList">
                    </div>
                <div class="scroll-indicator" id="scrollIndicator">
                    <span class="scroll-dot active"></span>
                    <span class="scroll-dot"></span>
                    <span class="scroll-dot"></span>
                </div>
            </div>

            <h2 class="featured-title" style="margin-top: 30px;">✨ 신규 비즈니스</h2>
            <div class="featured-container">
                <div class="featured-list" id="newList">
                    </div>
            </div>
        </div>
    </div>
    
    <div class="page active" id="searchPage">
        <div class="search-header">
            <button class="back-btn" onclick="goToMain()" style="display: none;">←</button>
            <h1 class="header-title">한인 비즈니스 검색</h1>
        </div>
        
        <div class="search-content">
            <div class="section">
                <div class="section-title">📍 위치 선택</div>
                <div class="location-grid"></div>
            </div>
            
            <div class="section">
                <div class="section-title">🔍 서비스 카테고리</div>
                <div class="service-grid"></div>
            </div>
            
            <button class="search-btn" onclick="doSearch()">🔍 검색하기</button>
        </div>
    </div>
    
    <div class="page" id="resultsPage">
        <div class="results-header">
            <button class="back-btn" onclick="goToSearch()" style="background: #667eea; color: white;">← 다시 검색</button>
            <div class="results-info">
                <strong id="resultLocation"></strong>의 
                <strong id="resultCategory"></strong> 검색 결과
            </div>
        </div>
        
        <div class="filter-tabs">
            <button class="filter-btn active" data-sort="default">전체</button>
            <button class="filter-btn" data-sort="popularity">⭐ 인기순</button>
            <button class="filter-btn" data-sort="distance">📍 거리순</button>
            <button class="filter-btn" data-sort="rating">✨ 평점순</button>
            <button class="filter-btn" data-sort="latest">🆕 최신순</button>
        </div>
        
        <div class="business-list" id="businessList">
            </div>
    </div>
    
    <div class="page" id="detailPage">
        <div class="detail-header">
            <button class="back-btn" onclick="goToResults()">← 뒤로</button>
            <div class="detail-name" id="detailName">...</div>
            <div class="detail-rating">
                <span id="detailRating">...</span>
            </div>
        </div>
        
        <div class="detail-content">
            <div class="info-section">
                <h3 class="info-title">기본 정보</h3>
                <div class="info-item">
                    <div class="info-icon">📍</div>
                    <div class="info-text" id="detailAddress">...</div>
                </div>
                <div class="info-item">
                    <div class="info-icon">📞</div>
                    <div class="info-text" id="detailPhone">...</div>
                </div>
                <div class="info-item">
                    <div class="info-icon">🕐</div>
                    <div class="info-text" id="detailHours">...</div>
                </div>
                <div class="info-item" id="websiteItem">
                    <div class="info-icon">🌐</div>
                    <div class="info-text" id="detailWebsite">...</div>
                </div>
            </div>
            
            <div class="action-buttons">
                <a class="action-btn primary" id="callBtn" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">📞 전화</a>
                <a class="action-btn secondary" id="mapBtn" target="_blank" rel="noopener noreferrer" style="text-decoration: none; display: flex; align-items: center; justify-content: center;">🗺️ 길찾기</a>
            </div>
            
            <div class="info-section">
                <h3 class="info-title">리뷰</h3>
                <div id="reviewsList">
                     <div class="review-text">현재 리뷰 정보가 없습니다.</div>
                </div>
            </div>
        </div>
    </div>
    
<script>
    // --- 1. [필수] 1단계에서 복사한 '웹 앱 URL'을 여기에 붙여넣으세요 ---
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzUK5O7nZJSwp9e9UnoAm2w_anNC_iXvzocFejxutf83IjJxgg2FIq5E-fr9InJiLbw/exec';
    // -----------------------------------------------------------

    // [신규] 카테고리 이름과 매칭되는 이모지 (커스터마이징 가능)
    const categoryEmojiMap = {
        '한식당/카페': '🍽️',
        '마트/식품점': '🛒',
        '뷰티 서비스': '💇',
        '의료 서비스': '🏥',
        '법률/세무': '⚖️',
        '생활 서비스': '🛠',
        '교육/학원': '📚',
        '이사/운송': '📦',
        '종교': '⛪'
        // 스프레드시트에 새 카테고리 추가 시, 이곳에도 이모지를 추가할 수 있습니다.
    };

    // 전역 변수
    let allBusinessData = {};
    let currentResultsList = [];
    let selectedLocation = ''; // [수정] 기본값은 동적으로 설정
    let selectedCategory = ''; // [수정] 기본값은 동적으로 설정
    let currentBusiness = null;
    let userLocation = null;

    // --- 2. 페이지 로드 시 앱 초기화 ---
    document.addEventListener('DOMContentLoaded', function() {
        initApp();
        setupEventListeners(); // [중요] 이벤트 리스너 설정 방식을 변경
    });

    // --- 3. [업그레이드] 앱 초기화 (데이터 로드 + 필터 생성) ---
    async function initApp() {
        showLoading();
        requestUserLocation(); // 사용자 위치 요청

        if (GAS_WEB_APP_URL === 'YOUR_GOOGLE_APP_SCRIPT_URL_HERE') {
            alert('HTML 파일 <script> 태그에 GAS_WEB_APP_URL 변수를 설정해야 합니다!');
            hideLoading();
            return;
        }

        try {
            const response = await fetch(GAS_WEB_APP_URL);
            if (!response.ok) throw new Error('데이터 로드 실패');
            
            const data = await response.json(); 
            if (data.error) throw new Error(data.error);

            allBusinessData = data.businessesByCategory;
            displayFeatured(data.featured);
            displayNew(data.new);
            
            // [신규] 필터 버튼 생성 함수 호출
            populateFilters(data.filters);

        } catch (error) {
            console.error('Error fetching data:', error);
            alert('데이터를 불러오는 데 실패했습니다. \n' + error.message);
        } finally {
            hideLoading();
        }
    }

    // --- 4. [신규] 필터 버튼 생성 함수 ---
    function populateFilters(filters) {
        const locationGrid = document.querySelector('.location-grid');
        const serviceGrid = document.querySelector('.service-grid');

        if (!locationGrid || !serviceGrid) return; // 페이지에 요소가 없으면 중단

        locationGrid.innerHTML = ''; // 비우기
        serviceGrid.innerHTML = ''; // 비우기

        // 4-1. 위치 버튼 생성
        if (filters.locations && filters.locations.length > 0) {
            filters.locations.forEach((location, index) => {
                const chip = document.createElement('div');
                chip.className = 'location-chip';
                chip.dataset.value = location; // data-value="미국"
                chip.textContent = location; // "미국"
                
                if (index === 0) { // 첫 번째 항목을 기본 선택
                    chip.classList.add('selected');
                    selectedLocation = location;
                }
                locationGrid.appendChild(chip);
            });
        } else {
            locationGrid.innerHTML = '등록된 위치가 없습니다.';
        }

        // 4-2. 서비스 카테고리 버튼 생성
        if (filters.categories && filters.categories.length > 0) {
            filters.categories.forEach((category) => {
                const item = document.createElement('div');
                item.className = 'service-item';
                item.dataset.value = category; // data-value="식당/카페"
                
                // 이모지 맵에서 이모지 찾기 (없으면 '❔')
                const emoji = categoryEmojiMap[category] || '❔';
                item.textContent = `${emoji} ${category}`;
                
                serviceGrid.appendChild(item);
            });
        } else {
            serviceGrid.innerHTML = '등록된 카테고리가 없습니다.';
        }
    }

    // --- 5. '인기 비즈니스' 생성 함수 ---
    function displayFeatured(featuredItems) {
        const list = document.getElementById('featuredList');
        list.innerHTML = ''; 
        if (!featuredItems || featuredItems.length === 0) {
            list.innerHTML = '<div class="featured-name" style="color: #888;">표시할 인기 비즈니스가 없습니다.</div>';
            return;
        }
        featuredItems.forEach(biz => {
            const card = document.createElement('div');
            card.className = 'featured-card';
            card.onclick = () => showDetail(biz);
            card.innerHTML = `
            <div class="featured-name">${biz.name}</div>
            <div class="featured-info">${biz.category} • ${biz.location || '위치 미정'}</div>
            <div class="featured-rating">⭐ ${biz.rating || 0} (${biz.reviews || 0})</div>
            `;
            list.appendChild(card);
        });
    }

    // --- 6. '신규 비즈니스' 생성 함수 ---
    function displayNew(newItems) {
        const list = document.getElementById('newList');
        if (!list) return;
        list.innerHTML = ''; 
        if (!newItems || newItems.length === 0) {
            list.innerHTML = '<div class="featured-name" style="color: #888;">표시할 신규 비즈니스가 없습니다.</div>';
            return;
        }
        newItems.forEach(biz => {
            const card = document.createElement('div');
            card.className = 'featured-card'; 
            card.onclick = () => showDetail(biz);
            card.innerHTML = `
            <div class="featured-name">${biz.name}</div>
            <div class="featured-info">${biz.category} • ${biz.location || '위치 미정'}</div>
            <div class="featured-rating">✨ (New)</div>
            `;
            list.appendChild(card);
        });
    }

    // --- 7. 검색 함수 ---
    function doSearch() {
        if (!selectedCategory) {
            alert('서비스 카테고리를 선택해주세요');
            return;
        }
        if (!selectedLocation) {
            alert('위치를 선택해주세요');
            return;
        }

        showLoading();
        document.getElementById('resultLocation').textContent = selectedLocation;
        document.getElementById('resultCategory').textContent = selectedCategory;
        
        const data = allBusinessData[selectedCategory] || [];
        const searchLocation = selectedLocation; 
        const filteredData = data.filter(biz => 
            biz.location && biz.location.includes(searchLocation)
        );
        
        currentResultsList = filteredData;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.filter-btn[data-sort="default"]').classList.add('active');
        renderBusinessList(currentResultsList);
        
        setTimeout(() => {
            hideLoading();
            showPage('resultsPage');
        }, 300);
    }

    // --- 8. 비즈니스 목록 렌더링 함수 ---
    function renderBusinessList(listToRender) {
        const listElement = document.getElementById('businessList');
        listElement.innerHTML = ''; 
        if (listToRender.length === 0) {
            listElement.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">검색 결과가 없습니다.</div>';
            return;
        }
        listToRender.forEach(biz => {
            const card = document.createElement('div');
            card.className = 'business-card';
            card.onclick = () => showDetail(biz);
            let ratingOrDistanceDisplay = '';
            
            // 'distance' 속성이 있는지 (즉, 거리순 정렬이 눌렸는지) 확인
            if (biz.distance !== undefined && biz.distance < 99999) {
                ratingOrDistanceDisplay = `📍 ${biz.distance.toFixed(1)} km`;
            } else {
                ratingOrDistanceDisplay = `⭐ ${biz.rating || 0}`;
            }
            card.innerHTML = `
                <div class="biz-header">
                    <div class="biz-name">${biz.name}</div>
                    <div class="biz-rating">${ratingOrDistanceDisplay}</div>
                </div>
                <div class="biz-info">📍 ${biz.address || '주소 미정'}</div>
                <div class="biz-tags">
                    ${(biz.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
                </div>
            `;
            listElement.appendChild(card);
        });
    }

    // --- 9. 정렬 적용 함수 ---
    function applySort(sortType) {
        if (sortType === 'distance') {
            if (!userLocation) {
                alert('브라우저에서 위치 정보 접근을 허용해야 거리순 정렬을 사용할 수 있습니다.');
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                document.querySelector('.filter-btn[data-sort="default"]').classList.add('active');
                return;
            }
            let listWithDistance = currentResultsList.map(biz => {
                let bizLat = Number(biz.latitude);
                let bizLon = Number(biz.longitude);
                let distance = 99999; 
                if (bizLat && bizLon) {
                    distance = getDistance(
                        userLocation.lat, userLocation.lon,
                        bizLat, bizLon
                    );
                }
                return { ...biz, distance: distance };
            });
            listWithDistance.sort((a, b) => a.distance - b.distance);
            renderBusinessList(listWithDistance);
            return; 
        }

        // 거리순 정렬이 아닐 경우, 'distance' 속성을 제거하고 다시 렌더링
        let sortedList = [...currentResultsList];

        switch (sortType) {
            case 'popularity':
                sortedList.sort((a, b) => (Number(b.reviews) || 0) - (Number(a.reviews) || 0));
                break;
            case 'rating':
                sortedList.sort((a, b) => (Number(b.rating) || 0) - (Number(a.rating) || 0));
                break;
            case 'latest':
                sortedList.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));
                break;
            case 'default':
            default:
                // 'currentResultsList' (시트 입력 순서) 그대로 사용
                break;
        }
        renderBusinessList(sortedList);
    }

    // --- 10. 상세 보기 함수 (업데이트됨) ---
    function showDetail(biz) {
        currentBusiness = biz;
        document.getElementById('detailName').textContent = biz.name;
        document.getElementById('detailRating').textContent = `⭐ ${biz.rating || 0} (${biz.reviews || 0})`;
        document.getElementById('detailAddress').textContent = biz.address || '정보 없음';
        document.getElementById('detailPhone').textContent = biz.phone || '정보 없음';
        document.getElementById('detailHours').textContent = biz.hours || '정보 없음';
        
        // ========== 홈페이지 정보 처리 ==========
        const websiteElement = document.getElementById('detailWebsite');
        const websiteItem = document.getElementById('websiteItem');
        
        if (biz.website && biz.website !== '정보 없음' && biz.website.trim() !== '') {
            let websiteURL = biz.website.trim();
            if (!websiteURL.toLowerCase().startsWith('http://') && 
                !websiteURL.toLowerCase().startsWith('https://')) {
                websiteURL = 'https://' + websiteURL;
            }
            websiteElement.innerHTML = `<a href="${websiteURL}" target="_blank">홈페이지 바로 가기</a>`;
            websiteItem.style.display = 'flex';
        } else {
            websiteItem.style.display = 'none';
        }
        
        // ========== 전화 버튼 설정 ==========
        const callBtn = document.getElementById('callBtn');
        if (biz.phone && biz.phone !== '정보 없음' && biz.phone.trim() !== '') {
            const cleanPhone = biz.phone.replace(/[^0-9+]/g, '');
            callBtn.href = `tel:${cleanPhone}`;
            callBtn.style.opacity = '1';
            callBtn.style.pointerEvents = 'auto';
            console.log('📞 전화번호 설정:', cleanPhone);
        } else {
            callBtn.href = '#';
            callBtn.style.opacity = '0.5';
            callBtn.style.pointerEvents = 'none';
            callBtn.onclick = (e) => {
                e.preventDefault();
                alert('전화번호 정보가 없습니다.');
            };
        }
        
        // ========== 길찾기 버튼 설정 ==========
        const mapBtn = document.getElementById('mapBtn');
        
        console.log('=== 🗺️ 길찾기 디버깅 정보 ===');
        console.log('비즈니스 이름:', biz.name);
        console.log('P열 (googleMapsUrl):', biz.googleMapsUrl);
        console.log('E열 (address):', biz.address);
        console.log('================================');
        
        // P열 URL 확인
        const mapURL = biz.googleMapsUrl ||
                       biz.googleMapsURL ||
                       biz.mapURL || 
                       biz.directions || 
                       biz.map;
        
        let finalMapURL = null;
        
        if (mapURL && mapURL.trim() !== '' && mapURL !== '정보 없음') {
            let normalizedURL = mapURL.trim();
            if (!normalizedURL.toLowerCase().startsWith('http://') && 
                !normalizedURL.toLowerCase().startsWith('https://')) {
                normalizedURL = 'https://' + normalizedURL;
            }
            finalMapURL = normalizedURL;
            console.log('✅ P열 URL 사용:', finalMapURL);
        } 
        else if (biz.address && biz.address !== '정보 없음') {
            console.log('⚠️ P열이 비어있어 E열 주소를 사용합니다.');
            const encodedAddress = encodeURIComponent(biz.address);
            finalMapURL = `https://www.google.com/maps/search/?api=1&query=${encodedAddress}`;
            console.log('📍 Fallback URL:', finalMapURL);
        }
        
        if (finalMapURL) {
            mapBtn.href = finalMapURL;
            mapBtn.style.opacity = '1';
            mapBtn.style.pointerEvents = 'auto';
        } else {
            mapBtn.href = '#';
            mapBtn.style.opacity = '0.5';
            mapBtn.style.pointerEvents = 'none';
            mapBtn.onclick = (e) => {
                e.preventDefault();
                alert('길찾기 정보가 없습니다.');
            };
        }
        
        const reviewsList = document.getElementById('reviewsList');
        reviewsList.innerHTML = '<div class="review-text">현재 리뷰 정보가 없습니다.</div>';
        showPage('detailPage');
    }

    // --- 11. 유틸리티 함수들 (페이지 이동, 로딩) ---
    function showPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }
    function goToSearch() { showPage('searchPage'); }
    function goToMain() { showPage('mainPage'); }
    function goToResults() { showPage('resultsPage'); }
    function showLoading() { document.getElementById('loading').classList.add('show'); }
    function hideLoading() { document.getElementById('loading').classList.remove('show'); }
    
    // --- 12. '거리순' 헬퍼 함수 (Geolocation, Haversine) ---
    function requestUserLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLocation = { lat: position.coords.latitude, lon: position.coords.longitude };
                    console.log('사용자 위치 확보:', userLocation);
                },
                (error) => {
                    console.warn('사용자 위치 정보를 가져올 수 없습니다:', error.message);
                    userLocation = null;
                }
            );
        } else {
            console.warn('이 브라우저는 Geolocation을 지원하지 않습니다.');
        }
    }
    function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // 지구 반지름 (km)
        const dLat = deg2rad(lat2 - lat1);
        const dLon = deg2rad(lon2 - lon1);
        const a =
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c; // 거리 (km)
    }
    function deg2rad(deg) {
        return deg * (Math.PI / 180);
    }

    // --- 13. [최종 업그레이드] 이벤트 리스너 설정 (이벤트 위임) ---
    function setupEventListeners() {
        
        // [신규] '검색 페이지'의 .search-content에 이벤트 리스너 위임
        const searchContent = document.querySelector('.search-content');
        if (searchContent) {
            searchContent.addEventListener('click', function(event) {
                const target = event.target;

                // 1. '위치 칩' 클릭 처리
                if (target.classList.contains('location-chip')) {
                    document.querySelectorAll('.location-chip').forEach(c => c.classList.remove('selected'));
                    target.classList.add('selected');
                    selectedLocation = target.dataset.value;
                }
                
                // 2. '서비스 아이템' 클릭 처리
                if (target.classList.contains('service-item')) {
                    document.querySelectorAll('.service-item').forEach(i => i.classList.remove('selected'));
                    target.classList.add('selected');
                    selectedCategory = target.dataset.value;
                }
            });
        }

        // [신규] '결과 페이지'의 .filter-tabs에 이벤트 리스너 위임
        const filterTabs = document.querySelector('.filter-tabs');
        if (filterTabs) {
            filterTabs.addEventListener('click', function(event) {
                const target = event.target;

                // 3. '필터 버튼' 클릭 처리
                if (target.classList.contains('filter-btn')) {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    target.classList.add('active');
                    
                    const sortType = target.dataset.sort;
                    applySort(sortType); // 정렬 함수 호출
                }
            });
        }

        // '인기 비즈니스' 스크롤 인디케이터
        const featuredList = document.getElementById('featuredList');
        const scrollDots = document.querySelectorAll('.scroll-dot');
        if (featuredList) {
            featuredList.addEventListener('scroll', function() {
                const scrollPercentage = (this.scrollLeft / (this.scrollWidth - this.clientWidth)) * 100;
                scrollDots.forEach(dot => dot.classList.remove('active'));
                if (scrollPercentage < 33) {
                    scrollDots[0].classList.add('active');
                } else if (scrollPercentage < 66) {
                    scrollDots[1].classList.add('active');
                } else {
                    scrollDots[2].classList.add('active');
                }
            });
        }
    }
</script>
